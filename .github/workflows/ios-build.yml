name: iOS Build

# Builds the Capacitor iOS app in the cloud on a macOS runner.
#
# Two jobs:
#   1. simulator-build  -> runs on every push/PR/manual trigger. No secrets or
#                          Apple Developer account needed. Produces an unsigned
#                          .app you can run in the iOS Simulator. Great for
#                          verifying the app compiles from a Windows dev machine.
#   2. signed-ipa        -> only runs when the required signing secrets exist.
#                          Produces a signed .ipa for a real device / TestFlight.
#
# Windows machines cannot run xcodebuild; this workflow does it on GitHub's
# macos runners instead.

on:
  push:
    branches: [main]
    paths:
      - "mobile_app/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "mobile_app/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch: {} # lets you trigger a build manually from the Actions tab

defaults:
  run:
    working-directory: mobile_app

jobs:
  # ---------------------------------------------------------------------------
  # Always-on: unsigned iOS Simulator build. Needs no Apple account or secrets.
  # ---------------------------------------------------------------------------
  simulator-build:
    name: Build (iOS Simulator, unsigned)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile_app/package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Build web assets (Vite)
        run: npm run build

      - name: Sync web + plugins into iOS project
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        working-directory: mobile_app/ios/App
        run: pod install

      - name: Build for iOS Simulator (no code signing)
        working-directory: mobile_app/ios/App
        run: |
          set -o pipefail
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO | xcbeautify || \
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Zip the .app bundle
        working-directory: mobile_app/ios/App
        run: |
          APP_PATH="$(find build/Build/Products -name 'App.app' -maxdepth 3 -type d | head -n1)"
          echo "Found app at: $APP_PATH"
          cd "$(dirname "$APP_PATH")"
          zip -r -y "$GITHUB_WORKSPACE/App-simulator.zip" App.app

      - name: Upload Simulator build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: App-simulator.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Always-on: UNSIGNED .ipa for a real device. Needs no Apple account/secrets.
  # The .ipa is not signed, so install it with a free sideloading tool
  # (Sideloadly / AltStore) that re-signs it with your own free Apple ID.
  # ---------------------------------------------------------------------------
  unsigned-ipa:
    name: Build unsigned .ipa (sideload)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile_app/package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Build web assets (Vite)
        run: npm run build

      - name: Sync web + plugins into iOS project
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        working-directory: mobile_app/ios/App
        run: pod install

      - name: Build device app WITHOUT signing
        working-directory: mobile_app/ios/App
        run: |
          set -o pipefail
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" | xcbeautify || \
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package .app into an unsigned .ipa
        working-directory: mobile_app/ios/App
        run: |
          APP_PATH="$(find build/Build/Products -name 'App.app' -maxdepth 3 -type d | head -n1)"
          echo "Found app at: $APP_PATH"
          WORK="$(mktemp -d)"
          mkdir -p "$WORK/Payload"
          cp -R "$APP_PATH" "$WORK/Payload/"
          (cd "$WORK" && zip -r -y "$GITHUB_WORKSPACE/App-unsigned.ipa" Payload)
          echo "Created App-unsigned.ipa"

      - name: Upload unsigned .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: App-unsigned.ipa
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Optional: signed .ipa for device / TestFlight.
  # Runs ONLY if the signing secrets are configured (see README notes below).
  # Skips cleanly otherwise, so the workflow stays green without Apple setup.
  # ---------------------------------------------------------------------------
  signed-ipa:
    name: Build signed .ipa (device / TestFlight)
    runs-on: macos-14
    # Gate on a secret so the job is skipped until you add signing credentials.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    env:
      HAS_SIGNING: ${{ secrets.IOS_P12_BASE64 != '' && secrets.IOS_MOBILEPROVISION_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stop early if signing secrets are missing
        if: ${{ env.HAS_SIGNING != 'true' }}
        run: |
          echo "::notice::Signing secrets not configured — skipping signed .ipa build."
          echo "Add IOS_P12_BASE64, IOS_P12_PASSWORD, IOS_MOBILEPROVISION_BASE64,"
          echo "IOS_SIGNING_IDENTITY, IOS_TEAM_ID, and IOS_PROVISIONING_PROFILE_NAME"
          echo "as repository secrets to enable this job."
          exit 0

      - name: Set up Node
        if: ${{ env.HAS_SIGNING == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile_app/package-lock.json

      - name: Install JS dependencies
        if: ${{ env.HAS_SIGNING == 'true' }}
        run: npm ci

      - name: Build web assets (production)
        if: ${{ env.HAS_SIGNING == 'true' }}
        run: npm run build:prod

      - name: Sync web + plugins into iOS project
        if: ${{ env.HAS_SIGNING == 'true' }}
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        if: ${{ env.HAS_SIGNING == 'true' }}
        working-directory: mobile_app/ios/App
        run: pod install

      - name: Import signing certificate & provisioning profile
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"

          echo "$IOS_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$IOS_MOBILEPROVISION_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -P "$IOS_P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: Archive & export signed .ipa
        if: ${{ env.HAS_SIGNING == 'true' }}
        working-directory: mobile_app/ios/App
        env:
          IOS_SIGNING_IDENTITY: ${{ secrets.IOS_SIGNING_IDENTITY }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          set -o pipefail

          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$IOS_SIGNING_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROVISIONING_PROFILE_NAME"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>$IOS_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.djthaika.ev</key>
              <string>$IOS_PROVISIONING_PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Upload signed .ipa artifact
        if: ${{ env.HAS_SIGNING == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
